id = "xopc/grafana"
name = "Grafana widgets"
version = "0.3.0"
plugin_api = 22
author = "xopc"

[[setting]]
key = "config_file"
type = "file"
label_key = "settings.config_file.label"
default = "~/.config/noctalia/grafana-widgets.json"

[[desktop_widget]]
id = "co2-chart"
entry = "chart.luau"

[[desktop_widget]]
id = "temperature-chart"
entry = "temperature-chart.luau"

[[desktop_widget]]
id = "power-chart"
entry = "power-chart.luau"

[[desktop_widget]]
id = "humidity-value"
entry = "humidity-value.luau"

[[desktop_widget]]
id = "today-power"
entry = "today-power.luau"
